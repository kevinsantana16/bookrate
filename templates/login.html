{% extends "base.html" %}

{% block title %}Login — BookRate{% endblock %}

{% block content %}
<div class="auth-wrapper">

  <div class="auth-card">
    <!-- Logo -->
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <i class="fas fa-book-open"></i>
      </div>
      <h1>BookRate</h1>
      <p>Avalie os livros que você leu</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">
        <i class="fas fa-sign-in-alt"></i> Entrar
      </button>
      <button class="auth-tab" id="tab-cadastro" onclick="switchTab('cadastro')">
        <i class="fas fa-user-plus"></i> Criar Conta
      </button>
    </div>

    <!-- ── LOGIN ── -->
    <form id="form-login" class="auth-form" method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label for="login-username">
          <i class="fas fa-user"></i> Usuário
        </label>
        <input
          id="login-username"
          type="text"
          name="username"
          placeholder="Digite seu usuário"
          autocomplete="username"
          required
        />
      </div>
      <div class="form-group">
        <label for="login-senha">
          <i class="fas fa-lock"></i> Senha
        </label>
        <div class="input-password-wrap">
          <input
            id="login-senha"
            type="password"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-password" onclick="togglePassword('login-senha', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        <i class="fas fa-sign-in-alt"></i> Entrar
      </button>
    </form>

    <!-- ── CADASTRO ── -->
    <form id="form-cadastro" class="auth-form hidden" method="POST" action="{{ url_for('cadastro') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label for="cad-username">
          <i class="fas fa-user"></i> Usuário
        </label>
        <input
          id="cad-username"
          type="text"
          name="username"
          placeholder="Escolha um nome de usuário"
          autocomplete="username"
          required
        />
      </div>
      <div class="form-group">
        <label for="cad-senha">
          <i class="fas fa-lock"></i> Senha
        </label>
        <div class="input-password-wrap">
          <input
            id="cad-senha"
            type="password"
            name="senha"
            placeholder="Crie uma senha (mín. 12 caracteres)"
            autocomplete="new-password"
            required
          />
          <button type="button" class="toggle-password" onclick="togglePassword('cad-senha', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label for="cad-confirmar">
          <i class="fas fa-lock"></i> Confirmar Senha
        </label>
        <div class="input-password-wrap">
          <input
            id="cad-confirmar"
            type="password"
            name="confirmar"
            placeholder="Repita a senha"
            autocomplete="new-password"
            required
          />
          <button type="button" class="toggle-password" onclick="togglePassword('cad-confirmar', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        <i class="fas fa-user-plus"></i> Criar Conta
      </button>
    </form>

  </div><!-- /auth-card -->

  <!-- Orbs decorativos -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Redireciona para a aba correta via hash
  (function () {
    if (window.location.hash === "#cadastro") switchTab("cadastro");
  })();
</script>
{% endblock %}
